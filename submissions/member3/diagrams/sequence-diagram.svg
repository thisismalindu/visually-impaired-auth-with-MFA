<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 1180" font-family="Helvetica, Arial, sans-serif">
  <title>Figure 1: Username/password login sequence, including the handoff to the OTP module</title>
  <desc>
    Sequence diagram with four lifelines: the user's browser, this module
    (auth/flow.py, Member 3), the database repository (Member 4), and the
    OTP module (auth/otp.py, Member 5). It shows the username step, the
    password step including the constant-shape lookup used to avoid
    revealing account existence, the redirect handoff into the OTP module,
    and the final authenticated request to /welcome.
  </desc>
  <defs>
    <marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#111827"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1040" height="1180" fill="#ffffff"/>
  <text x="520" y="28" text-anchor="middle" font-size="20" font-weight="bold" fill="#111827">Username / Password Login Sequence</text>

  <!-- Lifeline headers -->
  <g font-size="13" font-weight="bold" text-anchor="middle">
    <rect x="20" y="50" width="180" height="40" rx="6" fill="#f3f4f6" stroke="#111827"/>
    <text x="110" y="75">Browser (user + TTS)</text>

    <rect x="300" y="50" width="200" height="40" rx="6" fill="#dbeafe" stroke="#1e3a8a"/>
    <text x="400" y="75">auth/flow.py (Member 3)</text>

    <rect x="600" y="50" width="200" height="40" rx="6" fill="#fee2e2" stroke="#991b1b"/>
    <text x="700" y="75">database.repository (Member 4)</text>

    <rect x="860" y="50" width="160" height="40" rx="6" fill="#dcfce7" stroke="#14532d"/>
    <text x="940" y="75">auth/otp.py (Member 5)</text>
  </g>

  <!-- Lifelines -->
  <line x1="110" y1="90" x2="110" y2="1150" stroke="#9ca3af" stroke-dasharray="4,4"/>
  <line x1="400" y1="90" x2="400" y2="1150" stroke="#9ca3af" stroke-dasharray="4,4"/>
  <line x1="700" y1="90" x2="700" y2="1150" stroke="#9ca3af" stroke-dasharray="4,4"/>
  <line x1="940" y1="90" x2="940" y2="1150" stroke="#9ca3af" stroke-dasharray="4,4"/>

  <!-- Step helper macro via repeated groups -->
  <g font-size="11.5">

    <!-- 1 -->
    <line x1="110" y1="115" x2="400" y2="115" stroke="#111827" stroke-width="1.6" marker-end="url(#a1)"/>
    <text x="255" y="108" text-anchor="middle">1. GET /login</text>

    <line x1="400" y1="140" x2="110" y2="140" stroke="#4b5563" stroke-width="1.4" stroke-dasharray="3,3" marker-end="url(#a1)"/>
    <text x="255" y="133" text-anchor="middle">2. 200 render username.html (session.clear())</text>

    <!-- 3 -->
    <line x1="110" y1="175" x2="400" y2="175" stroke="#111827" stroke-width="1.6" marker-end="url(#a1)"/>
    <text x="255" y="168" text-anchor="middle">3. POST /login  {username}</text>
    <rect x="410" y="185" width="600" height="30" fill="#fffbeb" stroke="#b45309" stroke-width="1"/>
    <text x="420" y="204" font-size="10.5" fill="#92400e">Server sets auth_stage=username_submitted and pending_username; existence of the account is not checked here.</text>

    <line x1="400" y1="235" x2="110" y2="235" stroke="#4b5563" stroke-width="1.4" stroke-dasharray="3,3" marker-end="url(#a1)"/>
    <text x="255" y="228" text-anchor="middle">4. 302 redirect -&gt; /login/password</text>

    <!-- 5 -->
    <line x1="110" y1="270" x2="400" y2="270" stroke="#111827" stroke-width="1.6" marker-end="url(#a1)"/>
    <text x="255" y="263" text-anchor="middle">5. GET /login/password (stage check: username_submitted)</text>

    <line x1="400" y1="295" x2="110" y2="295" stroke="#4b5563" stroke-width="1.4" stroke-dasharray="3,3" marker-end="url(#a1)"/>
    <text x="255" y="288" text-anchor="middle">6. 200 render password.html</text>

    <!-- 7 -->
    <line x1="110" y1="330" x2="400" y2="330" stroke="#111827" stroke-width="1.6" marker-end="url(#a1)"/>
    <text x="255" y="323" text-anchor="middle">7. POST /login/password  {password}</text>

    <!-- 8 -->
    <line x1="400" y1="365" x2="700" y2="365" stroke="#111827" stroke-width="1.6" marker-end="url(#a1)"/>
    <text x="550" y="358" text-anchor="middle">8. get_user_by_username(pending_username)</text>

    <line x1="700" y1="390" x2="400" y2="390" stroke="#4b5563" stroke-width="1.4" stroke-dasharray="3,3" marker-end="url(#a1)"/>
    <text x="550" y="383" text-anchor="middle">9. user record | None</text>

    <rect x="410" y="405" width="600" height="60" fill="#fef2f2" stroke="#b91c1c" stroke-width="1"/>
    <text x="420" y="422" font-size="10.5" fill="#991b1b">10. verify_password(hash, password): if the user does not exist, a precomputed dummy</text>
    <text x="420" y="436" font-size="10.5" fill="#991b1b">Argon2 hash is verified instead, so the response time and outcome are the same as an</text>
    <text x="420" y="450" font-size="10.5" fill="#991b1b">existing user's wrong password (mitigates username enumeration, see Ref. [1]).</text>

    <line x1="400" y1="500" x2="110" y2="500" stroke="#b91c1c" stroke-width="1.4" stroke-dasharray="3,3" marker-end="url(#a1)"/>
    <text x="255" y="493" text-anchor="middle" fill="#991b1b">11a. [invalid] 401 render password.html, generic error</text>

    <line x1="400" y1="530" x2="110" y2="530" stroke="#14532d" stroke-width="1.4" stroke-dasharray="3,3" marker-end="url(#a1)"/>
    <text x="255" y="523" text-anchor="middle" fill="#14532d">11b. [valid] 302 redirect -&gt; /login/otp</text>

    <rect x="20" y="545" width="380" height="42" fill="#ecfdf5" stroke="#065f46" stroke-width="1"/>
    <text x="30" y="562" font-size="10.5" fill="#065f46">Server clears the session, then sets auth_stage=</text>
    <text x="30" y="576" font-size="10.5" fill="#065f46">password_verified and stores only user_id + username.</text>

    <!-- 12 -->
    <line x1="110" y1="620" x2="940" y2="620" stroke="#111827" stroke-width="1.6" marker-end="url(#a1)"/>
    <text x="525" y="613" text-anchor="middle">12. GET /login/otp -- guarded by require_stage(password_verified)</text>

    <line x1="940" y1="645" x2="110" y2="645" stroke="#4b5563" stroke-width="1.4" stroke-dasharray="3,3" marker-end="url(#a1)"/>
    <text x="525" y="638" text-anchor="middle">13. 200 render otp.html (Member 5 generates + emails the OTP)</text>

    <line x1="110" y1="680" x2="940" y2="680" stroke="#111827" stroke-width="1.6" marker-end="url(#a1)"/>
    <text x="525" y="673" text-anchor="middle">14. POST /login/otp  {code}  (Member 5 verifies against stored OTP hash)</text>

    <rect x="750" y="695" width="270" height="56" fill="#ecfdf5" stroke="#065f46" stroke-width="1"/>
    <text x="760" y="712" font-size="10.5" fill="#065f46">15. On success, Member 5 calls</text>
    <text x="760" y="726" font-size="10.5" fill="#065f46">auth.flow.mark_authenticated() -</text>
    <text x="760" y="740" font-size="10.5" fill="#065f46">the only path to auth_stage=authenticated.</text>

    <line x1="940" y1="770" x2="110" y2="770" stroke="#4b5563" stroke-width="1.4" stroke-dasharray="3,3" marker-end="url(#a1)"/>
    <text x="525" y="763" text-anchor="middle">16. 302 redirect -&gt; /welcome</text>

    <!-- welcome -->
    <line x1="110" y1="805" x2="400" y2="805" stroke="#111827" stroke-width="1.6" marker-end="url(#a1)"/>
    <text x="255" y="798" text-anchor="middle">17. GET /welcome -- guarded by require_stage(authenticated)</text>

    <line x1="400" y1="830" x2="110" y2="830" stroke="#4b5563" stroke-width="1.4" stroke-dasharray="3,3" marker-end="url(#a1)"/>
    <text x="255" y="823" text-anchor="middle">18. 200 render welcome.html (username)</text>

    <line x1="110" y1="865" x2="400" y2="865" stroke="#111827" stroke-width="1.6" marker-end="url(#a1)"/>
    <text x="255" y="858" text-anchor="middle">19. POST /logout</text>

    <line x1="400" y1="890" x2="110" y2="890" stroke="#4b5563" stroke-width="1.4" stroke-dasharray="3,3" marker-end="url(#a1)"/>
    <text x="255" y="883" text-anchor="middle">20. session.clear(); 302 redirect -&gt; /login</text>
  </g>

  <rect x="20" y="920" width="1000" height="230" fill="#f9fafb" stroke="#9ca3af" stroke-width="1"/>
  <text x="35" y="945" font-size="13" font-weight="bold" fill="#111827">Notes</text>
  <text x="35" y="965" font-size="11.5" fill="#374151">- Every stage check (steps 5, 12, 17) is enforced server-side by the require_stage() decorator reading session["auth_stage"]; the</text>
  <text x="35" y="982" font-size="11.5" fill="#374151">  browser cannot advance a stage itself, satisfying the "server-side authentication decisions only" requirement.</text>
  <text x="35" y="1002" font-size="11.5" fill="#374151">- The session never contains a plaintext password or OTP value at any step in this diagram.</text>
  <text x="35" y="1022" font-size="11.5" fill="#374151">- Steps 8-10 form the module boundary with Member 4's repository; steps 12-16 form the module boundary with Member 5's OTP</text>
  <text x="35" y="1039" font-size="11.5" fill="#374151">  service. auth/flow.py never imports auth/otp.py, avoiding a circular import (see Section 6 of the accompanying document).</text>
  <text x="35" y="1059" font-size="11.5" fill="#374151">- [1] OWASP Authentication Cheat Sheet, "Authentication Responses" - error messages and response timing must not confirm or</text>
  <text x="35" y="1076" font-size="11.5" fill="#374151">  deny whether a given account exists.</text>
</svg>
