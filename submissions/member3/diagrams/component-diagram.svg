<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 620" font-family="Helvetica, Arial, sans-serif">
  <title>Figure 3: Module boundaries and the auth/flow.py integration interface</title>
  <desc>
    Component diagram showing auth/flow.py at the centre, its dependency on
    the shared Argon2 helpers and, lazily, the database repository, its
    rendering of three templates owned by the accessibility member, and the
    named functions it exposes so the OTP module can gate its own route and
    complete authentication without either module importing the other
    directly at load time.
  </desc>
  <defs>
    <marker id="c1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#111827"/>
    </marker>
  </defs>
  <rect width="1020" height="620" fill="#ffffff"/>
  <text x="510" y="28" text-anchor="middle" font-size="20" font-weight="bold">Module Boundaries Around auth/flow.py</text>

  <!-- app.py -->
  <rect x="400" y="55" width="220" height="55" rx="8" fill="#f3f4f6" stroke="#111827" stroke-width="2"/>
  <text x="510" y="78" text-anchor="middle" font-size="13" font-weight="bold">app.py</text>
  <text x="510" y="94" text-anchor="middle" font-size="10.5">(Member 1: registers blueprints)</text>

  <!-- flow.py center -->
  <rect x="370" y="250" width="280" height="90" rx="8" fill="#dbeafe" stroke="#1e3a8a" stroke-width="2.5"/>
  <text x="510" y="278" text-anchor="middle" font-size="15" font-weight="bold">auth/flow.py</text>
  <text x="510" y="296" text-anchor="middle" font-size="10.5">(Member 3: username/password routes,</text>
  <text x="510" y="310" text-anchor="middle" font-size="10.5">session stage state machine)</text>
  <text x="510" y="328" text-anchor="middle" font-size="10" fill="#1e3a8a">auth_bp = Blueprint("auth", ...)</text>

  <!-- password_utils -->
  <rect x="60" y="270" width="220" height="55" rx="8" fill="#ede9fe" stroke="#5b21b6" stroke-width="2"/>
  <text x="170" y="293" text-anchor="middle" font-size="12.5" font-weight="bold">auth/password_utils.py</text>
  <text x="170" y="309" text-anchor="middle" font-size="10">(shared: hash_password, verify_password)</text>

  <!-- repository -->
  <rect x="60" y="430" width="220" height="60" rx="8" fill="#fee2e2" stroke="#991b1b" stroke-width="2"/>
  <text x="170" y="453" text-anchor="middle" font-size="12.5" font-weight="bold">database/repository.py</text>
  <text x="170" y="469" text-anchor="middle" font-size="10">(Member 4: get_user_by_username)</text>
  <text x="170" y="483" text-anchor="middle" font-size="9.5" fill="#991b1b">imported lazily inside the view function</text>

  <!-- templates -->
  <rect x="740" y="270" width="220" height="80" rx="8" fill="#fef3c7" stroke="#92400e" stroke-width="2"/>
  <text x="850" y="293" text-anchor="middle" font-size="12.5" font-weight="bold">templates/*.html</text>
  <text x="850" y="309" text-anchor="middle" font-size="10">(Member 2: username.html,</text>
  <text x="850" y="323" text-anchor="middle" font-size="10">password.html, welcome.html)</text>
  <text x="850" y="339" text-anchor="middle" font-size="9.5" fill="#92400e">rendered via render_template()</text>

  <!-- otp -->
  <rect x="740" y="430" width="220" height="110" rx="8" fill="#dcfce7" stroke="#14532d" stroke-width="2"/>
  <text x="850" y="453" text-anchor="middle" font-size="12.5" font-weight="bold">auth/otp.py</text>
  <text x="850" y="469" text-anchor="middle" font-size="10">(Member 5: /login/otp routes)</text>
  <text x="850" y="487" text-anchor="middle" font-size="9.5" fill="#14532d">imports from auth.flow:</text>
  <text x="850" y="501" text-anchor="middle" font-size="9.5" fill="#14532d">STAGE_PASSWORD_VERIFIED,</text>
  <text x="850" y="515" text-anchor="middle" font-size="9.5" fill="#14532d">require_stage, get_verified_user_id,</text>
  <text x="850" y="529" text-anchor="middle" font-size="9.5" fill="#14532d">mark_authenticated</text>

  <!-- Arrows -->
  <line x1="500" y1="110" x2="500" y2="245" stroke="#111827" stroke-width="2" marker-end="url(#c1)"/>
  <text x="440" y="185" font-size="10.5">register_blueprint(auth_bp)</text>

  <line x1="360" y1="290" x2="285" y2="290" stroke="#111827" stroke-width="2" marker-end="url(#c1)"/>
  <text x="322" y="280" text-anchor="middle" font-size="9.5">import (module load)</text>

  <line x1="420" y1="345" x2="230" y2="428" stroke="#991b1b" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#c1)"/>
  <text x="320" y="400" text-anchor="middle" font-size="9.5" fill="#991b1b">lazy import per request</text>

  <line x1="655" y1="290" x2="735" y2="290" stroke="#111827" stroke-width="2" marker-end="url(#c1)"/>
  <text x="695" y="280" text-anchor="middle" font-size="9.5">render_template(name, ...)</text>

  <line x1="740" y1="470" x2="655" y2="330" stroke="#14532d" stroke-width="2" marker-end="url(#c1)"/>
  <text x="780" y="400" text-anchor="middle" font-size="9.5" fill="#14532d">imports public</text>
  <text x="780" y="413" text-anchor="middle" font-size="9.5" fill="#14532d">interface only</text>

  <text x="510" y="570" text-anchor="middle" font-size="11" fill="#374151">
    auth/flow.py never imports auth/otp.py, so the dependency between the password step and the OTP step is one-directional
  </text>
  <text x="510" y="588" text-anchor="middle" font-size="11" fill="#374151">
    and cannot form an import cycle. Integration is completed solely by Member 1 registering both blueprints in app.py.
  </text>
</svg>
