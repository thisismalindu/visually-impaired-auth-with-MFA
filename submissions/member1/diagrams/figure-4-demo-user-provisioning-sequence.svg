<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="980" viewBox="0 0 1400 980" role="img" aria-labelledby="title desc">
  <title id="title">Demo-user provisioning sequence</title>
  <desc id="desc">A UML-style sequence diagram showing a trusted operator using the create-user command, hidden password entry, Argon2 hashing, repository creation, and a parameterized insert into Neon PostgreSQL.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker>
    <style>
      .title{font:700 28px Arial,sans-serif;fill:#0f172a}.subtitle{font:16px Arial,sans-serif;fill:#475569}
      .head{font:700 16px Arial,sans-serif;fill:#0f172a}.body{font:14px Arial,sans-serif;fill:#1e293b}
      .label{font:700 13px Arial,sans-serif;fill:#1e3a8a}.actor{fill:#dbeafe;stroke:#1d4ed8;stroke-width:2.5}
      .external{fill:#f8fafc;stroke:#64748b;stroke-width:2}.db{fill:#fef3c7;stroke:#b45309;stroke-width:2}
      .life{stroke:#64748b;stroke-width:2;stroke-dasharray:7 6}.message{stroke:#334155;stroke-width:2;fill:none;marker-end:url(#arrow)}
      .return{stroke:#475569;stroke-width:1.8;stroke-dasharray:7 5;fill:none;marker-end:url(#arrow)}
      .note{fill:#dcfce7;stroke:#15803d;stroke-width:2}.warn{fill:#fee2e2;stroke:#b91c1c;stroke-width:2}
    </style>
  </defs>
  <rect width="1400" height="980" fill="#ffffff"/>
  <text x="700" y="42" text-anchor="middle" class="title">Figure 4 — Demo-user provisioning sequence</text>
  <text x="700" y="70" text-anchor="middle" class="subtitle">Only an Argon2 hash crosses the repository boundary; the script contains no SQL</text>

  <rect x="60" y="110" width="200" height="70" rx="10" class="external"/><text x="160" y="152" text-anchor="middle" class="head">Trusted operator</text>
  <rect x="330" y="110" width="230" height="70" rx="10" class="actor"/><text x="445" y="143" text-anchor="middle" class="head">scripts/create_user.py</text><text x="445" y="164" text-anchor="middle" class="body">Member 1</text>
  <rect x="630" y="110" width="220" height="70" rx="10" class="actor"/><text x="740" y="143" text-anchor="middle" class="head">Argon2 helper</text><text x="740" y="164" text-anchor="middle" class="body">Member 1</text>
  <rect x="930" y="110" width="220" height="70" rx="10" class="external"/><text x="1040" y="143" text-anchor="middle" class="head">Repository</text><text x="1040" y="164" text-anchor="middle" class="body">Member 4</text>
  <rect x="1210" y="110" width="150" height="70" rx="10" class="db"/><text x="1285" y="143" text-anchor="middle" class="head">Neon</text><text x="1285" y="164" text-anchor="middle" class="body">PostgreSQL</text>

  <line x1="160" y1="180" x2="160" y2="900" class="life"/><line x1="445" y1="180" x2="445" y2="900" class="life"/>
  <line x1="740" y1="180" x2="740" y2="900" class="life"/><line x1="1040" y1="180" x2="1040" y2="900" class="life"/>
  <line x1="1285" y1="180" x2="1285" y2="900" class="life"/>

  <path d="M160 235 L443 235" class="message"/><text x="301" y="219" text-anchor="middle" class="label">1. Run python -m scripts.create_user</text>
  <path d="M445 290 L1038 290" class="message"/><text x="741" y="274" text-anchor="middle" class="label">2. Import create_user contract</text>
  <path d="M1040 335 L447 335" class="return"/><text x="741" y="321" text-anchor="middle" class="body">Repository available</text>

  <path d="M445 400 L162 400" class="message"/><text x="303" y="383" text-anchor="middle" class="label">3. Prompt username and email</text>
  <path d="M160 445 L443 445" class="return"/><text x="301" y="430" text-anchor="middle" class="body">username, email</text>
  <path d="M445 500 L162 500" class="message"/><text x="303" y="483" text-anchor="middle" class="label">4. getpass password + confirmation</text>
  <path d="M160 545 L443 545" class="return"/><text x="301" y="530" text-anchor="middle" class="body">hidden password values</text>

  <rect x="55" y="575" width="495" height="82" rx="10" class="note"/>
  <text x="303" y="603" text-anchor="middle" class="head">Plaintext boundary</text>
  <text x="303" y="627" text-anchor="middle" class="body">Exists transiently in process memory; never echoed or logged.</text>
  <text x="303" y="648" text-anchor="middle" class="body">Only the derived Argon2 hash is sent to the repository.</text>

  <path d="M445 700 L738 700" class="message"/><text x="592" y="684" text-anchor="middle" class="label">5. hash_password(password)</text>
  <path d="M740 745 L447 745" class="return"/><text x="592" y="730" text-anchor="middle" class="body">encoded Argon2 hash</text>
  <path d="M445 795 L1038 795" class="message"/><text x="741" y="779" text-anchor="middle" class="label">6. create_user(username, email, password_hash)</text>
  <path d="M1040 840 L1283 840" class="message"/><text x="1162" y="824" text-anchor="middle" class="label">7. Parameterized INSERT</text>
  <path d="M1285 880 L1042 880" class="return"/><text x="1162" y="866" text-anchor="middle" class="body">user record / controlled error</text>
  <path d="M1040 920 L447 920" class="return"/><text x="741" y="905" text-anchor="middle" class="body">result; raw database exception is not displayed</text>

  <rect x="875" y="395" width="465" height="205" rx="10" class="warn"/>
  <text x="1108" y="429" text-anchor="middle" class="head">Security and ownership annotations</text>
  <text x="900" y="464" class="body">• Script exits clearly if Member 4's module is absent.</text>
  <text x="900" y="495" class="body">• Password hash is created before persistence.</text>
  <text x="900" y="526" class="body">• Repository owns transactions and uniqueness errors.</text>
  <text x="900" y="557" class="body">• SQL values must be bound as parameters.</text>
  <text x="900" y="588" class="body">• No password, hash, DSN, or raw exception is printed.</text>
</svg>
