<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Username | Create account</title>
</head>
<body data-speech-prompt="Choose your username now.">
  <main>
    <h1>Create an account</h1>
    <p id="instruction">Choose your username now.</p>
    {% if error %}
    <p id="signup-error" role="alert" aria-live="assertive">{{ error }}</p>
    {% endif %}
    <form action="/signup" method="post">
      <label for="username">Username</label>
      <input id="username" name="username" type="text" autocomplete="username" required autofocus>
      <button type="submit">Continue</button>
    </form>
  </main>
  <script src="/static/accessibility.js"></script>
</body>
</html>
