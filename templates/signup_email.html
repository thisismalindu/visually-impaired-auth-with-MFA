<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Email | Create account</title>
</head>
<body data-speech-prompt="Type your email address now.">
  <main>
    <h1>Create an account</h1>
    <p id="instruction">Type your email address now.</p>
    {% if error %}
    <p id="signup-error" role="alert" aria-live="assertive">{{ error }}</p>
    {% endif %}
    <form action="/signup/email" method="post">
      <label for="email">Email address</label>
      <input id="email" name="email" type="email" autocomplete="email" required autofocus>
      <button type="submit">Continue</button>
    </form>
  </main>
  <script src="/static/accessibility.js"></script>
</body>
</html>
