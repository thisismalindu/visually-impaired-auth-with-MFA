<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}"><title>Confirm password</title></head>
<body data-speech-prompt="Confirm your password now.">
  <main>
    <h1>Confirm your password</h1>
    {% if error %}<p role="alert" aria-live="assertive">{{ error }}</p>{% endif %}
    <form method="post" action="{{ url_for('signup.signup_password_confirm') }}">
      <label for="password_confirmation">Confirm password</label>
      <input id="password_confirmation" name="password_confirmation" type="password" autocomplete="new-password" autofocus required>
      <button type="submit">Continue</button>
    </form>
  </main>
  <script src="{{ url_for('static', filename='accessibility.js') }}"></script>
</body>
</html>
