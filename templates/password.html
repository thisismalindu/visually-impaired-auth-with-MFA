<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Password | Secure sign in</title>
</head>
<body data-speech-prompt="Type your password now.">
  <main>
    <h1>Sign in</h1>
    <p id="instruction">Type your password now.</p>

    {% if error %}
    <p id="authentication-error" role="alert" aria-live="assertive">{{ error }}</p>
    {% endif %}

    <form action="/login/password" method="post">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required autofocus>
      <button type="submit">Continue</button>
    </form>
  </main>
  <script src="/static/accessibility.js"></script>
</body>
</html>
