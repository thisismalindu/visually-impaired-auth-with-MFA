<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Password | Create account</title>
</head>
<body data-speech-prompt="Create your password now.">
  <main>
    <h1>Create an account</h1>
    <p id="instruction">Create a password with at least eight characters.</p>
    {% if error %}
    <p id="signup-error" role="alert" aria-live="assertive">{{ error }}</p>
    {% endif %}
    <form action="{{ url_for('signup.signup_password') }}" method="post">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="new-password" minlength="8" required autofocus>
      <button type="submit">Continue</button>
    </form>
  </main>
  <script src="/static/accessibility.js"></script>
</body>
</html>
